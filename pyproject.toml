[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planegps"
version = "0.1.0"
description = "Detect aircraft flying over your location and show them on a monitor or LED board (PC / Raspberry Pi)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mrguygamer123933" }]
dependencies = [
    "Flask>=3.0",
    "requests>=2.31",
    "PyYAML>=6.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# Real FlightRadar24 data source (unofficial API client).
flightradar24 = ["FlightRadarAPI>=1.3.30"]
# Raspberry Pi RGB LED matrix bindings are built from source on the Pi
# (https://github.com/hzeller/rpi-rgb-led-matrix) and are NOT installed here.
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
planegps = "planegps.cli:main"

[tool.setuptools.packages.find]
include = ["planegps*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B027"]  # B027: optional no-op hooks on ABCs are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
