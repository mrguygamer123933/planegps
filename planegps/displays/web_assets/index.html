<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>planegps &mdash; planes overhead</title>
    <style>
      :root {
        --bg: #05070d;
        --panel: #0d1320;
        --panel-2: #131c2e;
        --edge: #1e2c45;
        --accent: #34d399;
        --accent-2: #38bdf8;
        --warn: #f59e0b;
        --text: #e6edf7;
        --muted: #7c8aa5;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: radial-gradient(1200px 800px at 70% -10%, #0a1424 0%, var(--bg) 60%);
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        display: flex; flex-direction: column; min-height: 100%;
      }
      header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 14px 22px; border-bottom: 1px solid var(--edge);
        background: linear-gradient(180deg, rgba(19,28,46,.85), rgba(13,19,32,.6));
      }
      .brand { display: flex; align-items: baseline; gap: 12px; }
      .brand h1 { font-size: 20px; margin: 0; letter-spacing: .5px; }
      .brand .plane { color: var(--accent); }
      .brand small { color: var(--muted); }
      .meta { display: flex; gap: 22px; font-size: 13px; color: var(--muted); }
      .meta b { color: var(--text); font-weight: 600; }
      .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background: var(--accent); margin-right:6px; box-shadow:0 0 8px var(--accent); }
      .dot.stale { background: var(--warn); box-shadow:0 0 8px var(--warn); }

      main { display: grid; grid-template-columns: minmax(360px, 1fr) minmax(360px, 520px); gap: 20px; padding: 20px; flex: 1; }
      @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

      .card { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--edge); border-radius: 16px; padding: 16px; }
      .card h2 { margin: 0 0 12px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }

      .radar-wrap { display:flex; align-items:center; justify-content:center; }
      #radar { width: 100%; max-width: 520px; height: auto; }

      .list { display: flex; flex-direction: column; gap: 10px; max-height: 70vh; overflow-y: auto; }
      .flight { border: 1px solid var(--edge); border-radius: 12px; padding: 12px 14px; background: rgba(9,14,24,.6); }
      .flight.top { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(52,211,153,.25) inset; }
      .flight .row1 { display:flex; align-items:center; justify-content:space-between; }
      .flight .cs { font-size: 18px; font-weight: 700; letter-spacing: .5px; }
      .flight .type { font-size: 12px; color: var(--accent-2); border:1px solid var(--edge); padding:2px 8px; border-radius:999px; }
      .flight .route { font-size: 15px; margin: 6px 0 8px; color: var(--text); }
      .flight .route .arrow { color: var(--accent); margin: 0 6px; }
      .flight .stats { display:flex; flex-wrap:wrap; gap: 14px; font-size: 12px; color: var(--muted); }
      .flight .stats b { color: var(--text); font-weight: 600; }
      .empty { color: var(--muted); text-align:center; padding: 30px 0; }
      .count-badge { background: var(--accent); color:#04150e; font-weight:700; border-radius:999px; padding:1px 9px; font-size:12px; margin-left:8px; }
      footer { text-align:center; color: var(--muted); font-size: 12px; padding: 10px; }
      .err { color: var(--warn); }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <h1><span class="plane">&#9992;</span> planegps</h1>
        <small>planes flying over your location</small>
      </div>
      <div class="meta">
        <div><span id="statusdot" class="dot"></span><span id="status">connecting&hellip;</span></div>
        <div>Location: <b id="loc">&mdash;</b></div>
        <div>Radius: <b id="radius">&mdash;</b></div>
        <div>Source: <b id="source">&mdash;</b></div>
      </div>
    </header>

    <main>
      <section class="card radar-wrap">
        <div style="width:100%">
          <h2>Radar</h2>
          <canvas id="radar" width="520" height="520"></canvas>
        </div>
      </section>

      <section class="card">
        <h2>Overhead now <span id="count" class="count-badge">0</span></h2>
        <div id="list" class="list"><div class="empty">Waiting for data&hellip;</div></div>
      </section>
    </main>

    <footer>planegps &middot; refresh every second &middot; radius is customizable in <code>config.yaml</code></footer>

    <script src="/app.js"></script>
  </body>
</html>
